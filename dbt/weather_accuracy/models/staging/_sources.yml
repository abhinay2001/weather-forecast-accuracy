version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: forecast_daily
        description: daily forecast snapshots pulled from Open-Meteo, one row per (city, forecast_made_on, target_date)
      - name: actuals_daily
        description: actual observed weather (ERA5 reanalysis) from Open-Meteo, one row per (city, target_date)
